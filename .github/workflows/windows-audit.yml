name: Windows Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  native-and-release:
    name: Native smoke and release integrity
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate package and PowerShell sources
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $versionText = Get-Content cac.ps1 -Raw
          $versionMatch = [regex]::Match($versionText, '\$CAC_VERSION\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success -or $package.version -ne $versionMatch.Groups[1].Value) {
            throw "Version mismatch: package.json=$($package.version), cac.ps1=$($versionMatch.Groups[1].Value)"
          }
          if ($package.bin.cac -ne 'cac.cmd') { throw "Windows npm entry must be cac.cmd" }
          if ($package.repository.url -ne 'git+https://github.com/pengwenyi4061126-lgtm/huanjing.git') {
            throw "package.json repository does not match the active repository"
          }
          $files = @(
            'scripts/release-check.ps1',
            'scripts/profile-check.ps1',
            'scripts/native-boundary-check.ps1',
            'scripts/desktop-native-check.ps1',
            'scripts/desktop-profile.ps1',
            'scripts/cert-silent.ps1',
            'scripts/network-check.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "$file parse failed: $($errors[0].Message)" }
          }

      - name: Validate package contents and JavaScript syntax
        shell: pwsh
        run: |
          $pack = @(npm.cmd pack --ignore-scripts --dry-run --json | ConvertFrom-Json)
          $paths = @($pack[0].files | ForEach-Object { $_.path })
          foreach ($required in @('cac.cmd', 'cac.ps1', 'native/dist/NativeBridge.dll', 'native/dist/cac-native-launch.exe', 'native/dist/cac-native-launch.sha256')) {
            if ($paths -notcontains $required) { throw "npm package is missing $required" }
          }
          foreach ($file in @('scripts/postinstall.js', 'scripts/patch-cli.js', 'scripts/verify-cli.js', 'scripts/fingerprint-shim.js', 'scripts/fingerprint-cdp.js', 'scripts/fingerprint-test.js', 'fingerprint-hook.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript parse failed: $file" }
          }

      - name: Run NativeBridge smoke suite
        shell: pwsh
        run: ./native/tests/run-smoke.ps1

      - name: Verify release artifacts
        shell: pwsh
        run: ./scripts/release-check.ps1
