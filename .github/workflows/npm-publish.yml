name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            npm version "$VERSION" --no-git-tag-version
          else
            echo "package.json already at $VERSION"
          fi
          CURRENT_CAC_VERSION=$(python3 - <<'PY'
          import re
          print(re.search(r'\$CAC_VERSION\s*=\s*"([^"]+)"', open("cac.ps1", encoding="utf-8-sig").read()).group(1))
          PY
          )
          if [[ "$CURRENT_CAC_VERSION" != "$VERSION" ]]; then
            python3 - "$VERSION" <<'PY'
            import pathlib
            import re
            import sys

            path = pathlib.Path("cac.ps1")
            text = path.read_text(encoding="utf-8-sig")
            text = re.sub(r'\$CAC_VERSION\s*=\s*"[^"]+"', f'$CAC_VERSION = "{sys.argv[1]}"', text, count=1)
            path.write_text(text, encoding="utf-8")
            PY
          else
            echo "cac.ps1 already at $VERSION"
          fi

      - name: Build
        run: bash build.sh

      - name: Verify Windows package and Native artifacts
        shell: pwsh
        run: ./scripts/release-check.ps1

      - name: Publish
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
